<body>
  <div class="panel-default">
    <div class="panel-heading">
        <p>リアルタイムチャットサンプル</p>
    </div>
    <div id="scroller" class="panel-body">
        <ul id='messages'>
        </ul>
    </div>
    <div class="panel-footer">
        <input type='text' class="form-control" id="nameInput" placeholder="ユーザー名を入力してください">
    </div>
    <div class="panel-footer">
        <input type='text' class="form-control" id="messageInput" placeholder="メッセージ内容を入力してください">
    </div>
</div>


  <!-- Firebase設定 -->
  <!--<script src="https://cdn.firebase.com/js/client/2.3.2/firebase.js"></script>
  <script src="https://www.gstatic.com/firebasejs/4.1.3/firebase.js"></script>-->

  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries
  
    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: window.ENV_CONFIG.FIREBSE_API_KEY,
      authDomain: window.ENV_CONFIG.FIREBSE_AUTH_DOMAIN,
      databaseURL: window.ENV_CONFIG.FIREBSE_DATABASE_URL,
      projectId: window.ENV_CONFIG.FIREBSE_PROJECT_ID,
      storageBucket: window.ENV_CONFIG.FIREBSE_STORAGE_BUCKET,
      messagingSenderId: window.ENV_CONFIG.FIREBSE_MASSAGE_SENDER_ID,
      appId: window.ENV_CONFIG.FIREBSE_APP_ID
    };

  
    // Initialize Firebase
    //const app = initializeApp(firebaseConfig);
    const app = firebase.initializeApp(firebaseConfig);
    //const database = app.database();
    //var myFirebaseRef =firebase.database();
    const database = firebase.database();

    const dbRef = database.ref();

    
    // Read data from the database
    dbRef.on('value', (snapshot) => {
      console.log(snapshot.val());
      //取得したデータ
      var data = snapshot.val();
      var username = data.name || "anonymous";
      var message = data.text;

      if ( username == nameField.val() ) {//取得したデータの名前が自分の名前なら右側に吹き出しを出す
          var messageElement = $("<il><p class='sender_name me'>" + username + "</p><p class='right_balloon'>" + message + "</p><p class='clear_balloon'></p></il>");
      } else {
          var messageElement = $("<il><p class='sender_name'>" + username + "</p><p class='left_balloon'>" + message + "</p><p class='clear_balloon'></p></il>");
      }
      messageList.append(messageElement)//HTMLに取得したデータを追加する
      messageList[0].scrollTop = messageList[0].scrollHeight;//一番下にスクロールする
    });

// データベースと接続する
//var myFirebaseRef = new Firebase("https://<YOUR-FIREBASE-APP>.firebaseio.com/");
//var myFirebaseRef = new Firebase("https://pwa-firebase-1993.firebaseio.com/");
//var myFirebaseRef = new Firebase("https://pwa-firebase-1993-default-rtdb.asia-southeast1.firebasedatabase.app");
//const myFirebaseRef = firebase.database("https://pwa-firebase-1993-default-rtdb.asia-southeast1.firebasedatabase.app");
//var messagesRef = new Firebase('https://qiita.firebaseio.com/');

var messageField = $('#messageInput');
var nameField = $('#nameInput');
var messageList = $('#messages');

// ENTERキーを押した時に発動する
messageField.keypress(function (e) {
    if (e.keyCode == 13) {
        //フォームに入力された情報
        var username = nameField.val();
        var message = messageField.val();

        //データベースに保存する
        //messagesRef.push({name:username, text:message});
        //myFirebaseRef.push({name:username, text:message});
        dbRef.set({name: username,text: message});
        messageField.val('');

        $('#scroller').scrollTop($('#messages').height());
    }
});

// データベースにデータが追加されたときに発動する
//messagesRef.limitToLast(10).on('child_added', function (snapshot) {
//myFirebaseRef.limitToLast(10).on('child_added', function (snapshot) {
//dbRef.limitToLast(10).on('child_added', function (snapshot) {
dbRef.on('child_added', (snapshot) => {

    //取得したデータ
    var data = snapshot.val();
    var username = data.name || "anonymous";
    var message = data.text;

    if ( username == nameField.val() ) {//取得したデータの名前が自分の名前なら右側に吹き出しを出す
        var messageElement = $("<il><p class='sender_name me'>" + username + "</p><p class='right_balloon'>" + message + "</p><p class='clear_balloon'></p></il>");
    } else {
        var messageElement = $("<il><p class='sender_name'>" + username + "</p><p class='left_balloon'>" + message + "</p><p class='clear_balloon'></p></il>");
    }
    messageList.append(messageElement)//HTMLに取得したデータを追加する
    messageList[0].scrollTop = messageList[0].scrollHeight;//一番下にスクロールする
});
</script>

<style>
ul,li{
    padding: 0;
    margin: 0;
    list-style-type: none;
	text-align: left;
}
#scroller {
    height: 500px;
    overflow: auto;
}

/*******************************
* 左からの吹き出し
********************************/
.left_balloon {
    position: relative;
    background: #f1f0f0;
    border: 0px solid #777;
    margin: 5px 10px;
    padding: 5px 10px;
    border-radius: 15px;
    width: 400px;
    clear: both;
}

/*******************************
* 右からの吹き出し
********************************/
.right_balloon {
    color: #fff;
    position: relative;
    background: #0084ff;
    border: 0px solid #777;
    margin: 5px 10px;
    padding: 5px 10px;
    border-radius: 15px;
    width: 400px;
    clear: both;
    float: right;
}

/*******************************
* 割り込みを解除
********************************/
.clear_balloon{
  clear: both;
}



.sender_name{
    margin-bottom: -5px;
    padding-left: 20px;
    color: rgba(0, 0, 0, .40);
}
.sender_name.me{
    float: right;
    padding: 0 20px 0 0;
}
</style>
